name: Build documentation with zensical

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.13'
        enable-cache: true
    - name: Install dependencies
      run: uv sync
    - name: Build with zensical
      run: uv run zensical build
